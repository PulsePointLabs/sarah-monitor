name: Build and release APK

# Every push builds, tests, signs and publishes a release with a direct APK link.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # The APK is signed with signing/sarah-monitor.jks (committed), so every release installs over the last.
      - name: Expected signing certificate
        run: |
          KEY_SHA256=$(keytool -exportcert -keystore signing/sarah-monitor.jks -storepass sarahmonitor -alias sarahmonitor \
            | sha256sum | cut -d' ' -f1)
          echo "KEY_SHA256=$KEY_SHA256" >> "$GITHUB_ENV"

      - name: Unit tests and APK
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Verify APK signature
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | tee signers.txt
          APK_SHA256=$(grep -m1 -oP 'certificate SHA-256 digest: \K[0-9a-f]+' signers.txt)
          if [ "$APK_SHA256" != "$KEY_SHA256" ]; then
            echo "::error::APK is signed with $APK_SHA256, expected $KEY_SHA256."
            exit 1
          fi

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          BRANCH="${GITHUB_REF_NAME//\//-}"
          TAG="v${VERSION}-${BRANCH}-${GITHUB_RUN_NUMBER}"
          APK="sarah-monitor-${VERSION}-${SHORT_SHA}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          # The release notes are the full commit message (what changed and why), so the release page reads as a
          # changelog. main and rc/* builds are real releases ("Latest"); other branches are marked test builds.
          CHANGES=$(git log -1 --format=%B | grep -v '^Co-Authored-By:')
          FLAGS="--latest"
          case "$GITHUB_REF_NAME" in main|rc/*) ;; *) FLAGS="--prerelease" ;; esac
          printf '%s\n\n---\n**Download:** https://github.com/%s/releases/download/%s/%s\n\nBuilt from branch %s at %s. Unit tests passed; APK signed with the Sarah Monitor key.\n' \
            "$CHANGES" "$GITHUB_REPOSITORY" "$TAG" "$APK" "$GITHUB_REF_NAME" "$GITHUB_SHA" > notes.md
          gh release create "$TAG" "$APK" \
            --target "$GITHUB_SHA" $FLAGS \
            --title "Sarah Monitor ${VERSION}" \
            --notes-file notes.md
